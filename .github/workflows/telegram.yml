# Sends a Telegram message when a PR opens (Renovate's weekly updates), with what changes and
# the link to merge it, and when CI or a release fails. Repo secrets: TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID.
name: Telegram
on:
  pull_request:
    types:
      - opened
      - reopened
  workflow_run:
    workflows:
      - CI
      - Release
    types:
      - completed
permissions: {}

jobs:
  pull-request:
    # Not for PRs from forks: they get no secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Send the PR to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          URL: ${{ github.event.pull_request.html_url }}
        shell: python
        run: |
          import os, re, urllib.parse, urllib.request
          # Renovate's table rows: | [docker.io/linuxserver/prowlarr](...) | minor | `2.6.5` -> `2.7.0` |
          lines = []
          for row in (os.environ["BODY"] or "").splitlines():
              cells = [c.strip() for c in row.strip().strip("|").split("|")]
              change = next((c for c in cells if "→" in c or "->" in c), None)
              name = re.match(r"\[([^\]]+)\]", cells[0])
              if change and name:
                  lines.append(f"• {name[1].split('/')[-1]}: {change.replace('`', '')}")
          text = "\n".join([f"🆕 {os.environ['TITLE']}", *lines, "", os.environ["URL"]])
          data = urllib.parse.urlencode({"chat_id": os.environ["CHAT_ID"], "text": text,
                                         "disable_web_page_preview": "true"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TOKEN']}/sendMessage", data)

  failed:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send the failed run to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: |-
            ❌ ${{ github.event.workflow_run.name }} failed on ${{ github.event.workflow_run.head_branch }}
            ${{ github.event.workflow_run.display_title }}

            ${{ github.event.workflow_run.html_url }}
        run: |
          curl -sf -o /dev/null "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${TEXT}" \
            --data-urlencode "link_preview_options={\"is_disabled\":true}"
