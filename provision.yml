---
# ansible-playbook provision.yml
#
# Runs as root, so the Docker socket works on the very first run. Paths and ownership
# come from inventory/group_vars/homelab.

- name: Provision the homelab
  hosts: homelab
  become: true

  pre_tasks:
    # Your configuration: every .yml in config/, a link to your private repo (README).
    - name: Check that config/vault.yml exists
      ansible.builtin.assert:
        that: (homelab_config_dir ~ '/vault.yml') is file
        fail_msg: No config/vault.yml. Run ./setup.sh first.
        quiet: true
      tags: always

    - name: Read your configuration
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: "{{ query('ansible.builtin.fileglob', homelab_config_dir ~ '/*.yml') | sort }}"
      no_log: true
      tags: always

    - name: Check the required keys in config/vault.yml
      ansible.builtin.assert:
        that: lookup('ansible.builtin.vars', item, default='') | string | length > 0
        fail_msg: Fill in {{ item }} in config/vault.yml (ansible-vault edit config/vault.yml).
        quiet: true
      loop:
        - vault_homelab_user
        - vault_homelab_password
        - vault_admin_email
        - vault_backup_password
      tags: always

    # A run you start by hand waits for an automatic deploy that is busy (roles/autodeploy).
    - name: Wait for an automatic deploy to finish
      ansible.builtin.systemd_service:
        name: homelab-autodeploy
      register: _autodeploy_state
      until: _autodeploy_state.status.ActiveState | default('') != 'activating'
      retries: 60
      delay: 10
      check_mode: false
      when: lookup('env', 'HOMELAB_AUTODEPLOY') == ''
      tags: always

    # Run by hand from a branch: the automatic deploys hold, so main doesn't replace what you are
    # testing. Run from main and they follow main again. /hold and /main do the same in Telegram.
    - name: Hold or release the automatic deploys
      when:
        - lookup('env', 'HOMELAB_AUTODEPLOY') == ''
        - homelab_repo | default('') | length > 0
      tags: always
      block:
        # The git module only clones and updates; it can't tell the branch.
        - name: Read the branch you run from
          ansible.builtin.command: git -C {{ playbook_dir }} rev-parse --abbrev-ref HEAD  # noqa: command-instead-of-module
          register: _homelab_branch
          changed_when: false
          check_mode: false
          become: true
          become_user: "{{ homelab_user }}"

        - name: Create the folder for the hold
          ansible.builtin.file:
            path: "{{ homelab_state_dir }}"
            state: directory
            owner: "{{ homelab_uid }}"
            group: "{{ homelab_gid }}"
            mode: "0755"

        - name: Hold the automatic deploys (a run from a branch)
          ansible.builtin.copy:
            content: "{{ _homelab_branch.stdout }}\n"
            dest: "{{ homelab_state_dir }}/hold"
            owner: "{{ homelab_uid }}"
            group: "{{ homelab_gid }}"
            mode: "0644"
          register: _homelab_hold
          when: _homelab_branch.stdout != 'main'

        - name: Release the automatic deploys (a run from main)
          ansible.builtin.file:
            path: "{{ homelab_state_dir }}/hold"
            state: absent
          register: _homelab_release
          when: _homelab_branch.stdout == 'main'

        - name: Tell Telegram
          ansible.builtin.uri:
            url: "https://api.telegram.org/bot{{ homelab_telegram_bot_token }}/sendMessage"
            method: POST
            body_format: json
            body:
              chat_id: "{{ homelab_telegram_chat_id }}"
              text: >-
                {{ '✋ Auto-deploys on hold: you are running ' ~ _homelab_branch.stdout ~ '. /main puts main back.'
                   if _homelab_hold is changed else '▶️ Auto-deploys follow main again.' }}
          when: homelab_telegram | bool and (_homelab_hold is changed or _homelab_release is changed)
          no_log: true

  roles:
    - role: tailscale
      tags: tailscale
      when: homelab_tailscale | bool
    - role: docker
      tags: docker
    - role: homelab_common
      tags: always
    - role: download_stack
      tags: download
    - role: media_stack
      tags: media
    - role: books_stack
      tags: books
      when: homelab_books | bool
    - role: monitoring_stack
      tags: monitoring
      when: homelab_monitoring | bool or homelab_homepage | bool
    - role: app_config
      tags: apps
    - role: backup
      tags: backup
      when: homelab_backup_remote | length > 0
    - role: autodeploy
      tags: autodeploy
      when: homelab_repo | default('') | length > 0
