---
# Your login instead of the default admin on a fresh install, Kobo sync with the Kobo store
# passed through, and your own users (app_config_calibre_users) with their Kobo tokens, so the
# Kobos keep syncing after a reinstall.
- name: Calibre-Web | Login, Kobo sync and users
  calibre_web:
    db: "{{ homelab_stack_dirs.books }}/appdata/calibre/app.db"
    login:
      username: "{{ homelab_username }}"
      password: "{{ homelab_password }}"
      email: "{{ homelab_admin_email }}"
    users: "{{ app_config_calibre_users }}"
  register: _app_config_calibre

# Calibre-Web reads its settings only when it starts.
- name: Calibre-Web | Restart for the new settings
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_stack_dirs.books }}"
    services:
      - calibre
    state: restarted
    wait: true
    wait_timeout: 300
  when: _app_config_calibre.restart
